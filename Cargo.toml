[package]
name = "k708-control"
version = "0.1.0"
edition = "2021"
description = "Linux control panel for Redragon RGB keyboards (K708-RGB-PRO protocol)"

[[bin]]
name = "k708-control"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
png = "0.18"

[profile.release]
opt-level = 2
